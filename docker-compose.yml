# Runs the whole app locally: a Postgres database plus the backend (which
# also serves the built frontend -- see Dockerfile). `docker compose up`
# is the easiest way to try Postgres without installing it yourself.
#
#   docker compose up --build       # first run, or after code changes
#   docker compose up -d db         # just the database (e.g. to run the
#                                    # test suite against it from the host)
#
# Then open http://localhost:8000 for the app itself.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: snake_arena
      POSTGRES_PASSWORD: snake_arena
      POSTGRES_DB: snake_arena
    ports:
      # Published to the host so `pytest` (run directly on your machine,
      # not in a container) can reach this same database -- see
      # tests/conftest.py and README.md. If something else on your
      # machine is already using 5432, change the left side here (and the
      # matching defaults in backend/app/database.py and
      # tests/conftest.py / tests/frontend/conftest.py) to a free port.
      - "5432:5432"
    volumes:
      - snake-arena-db-data:/var/lib/postgresql/data
      # Creates the separate snake_arena_test database on first startup
      # (only runs against a fresh, empty data volume -- see the file).
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snake_arena -d snake_arena"]
      interval: 2s
      timeout: 3s
      retries: 15

  backend:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://snake_arena:snake_arena@db:5432/snake_arena
      # Reported on every trace as deployment.environment.name -- see
      # backend/app/telemetry.py. Add OTEL_TRACES_EXPORTER: console here
      # to print spans to `docker compose logs backend`.
      APP_ENVIRONMENT: local

  # Optional local Grafana with the Snake Arena dashboard, reading the
  # game metrics from CloudWatch. Not started by a plain `docker compose
  # up` (it's in the "monitoring" profile) -- start it with
  # grafana/start.sh. It signs in to AWS with your `aws login` session
  # (renewing its short-lived credentials itself, like the AWS CLI), so it
  # keeps working until that session ends.
  grafana:
    image: grafana/grafana:13.2.2
    profiles: ["monitoring"]
    ports:
      # This machine only: the container holds your AWS credentials.
      - "127.0.0.1:3000:3000"
    environment:
      AWS_PROFILE: ${AWS_PROFILE:-default}
      AWS_REGION: us-east-2
      # No login needed locally (Editor, so Explore works too).
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Editor
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/snake-arena.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      # Only your AWS profile settings and `aws login` session (writable,
      # so renewed credentials can be cached) -- not ~/.aws/credentials,
      # which can hold long-lived keys. Grafana looks for .aws in its
      # install directory, not $HOME.
      - ${HOME}/.aws/config:/usr/share/grafana/.aws/config:ro
      - ${HOME}/.aws/login:/usr/share/grafana/.aws/login

volumes:
  # Persists Postgres data across `docker compose down`/`up` cycles. Use
  # `docker compose down -v` if you want a clean leaderboard instead.
  snake-arena-db-data:
