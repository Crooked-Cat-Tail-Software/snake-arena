AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Snake Arena -- lets GitHub Actions deploy to AWS without any stored
  AWS credentials, via GitHub's OIDC identity provider. Creates an IAM
  role that GitHub Actions can assume for exactly one repo (and,
  optionally, one branch), scoped to the permissions the CI/CD pipeline
  actually needs (push to this project's ECR repo, deploy the two
  CloudFormation stacks in infra/aws/, and manage the one ECS execution
  role those stacks create).

  Deploy this ONCE, yourself, before using the "deploy" job in
  .github/workflows/ci-cd.yaml -- it's not something the pipeline
  deploys for itself (a GitHub Actions run has no AWS access at all
  until this role exists). After it deploys, copy the DeployRoleArn
  output into a GitHub repository variable named AWS_DEPLOY_ROLE_ARN
  (Settings -> Secrets and variables -> Actions -> Variables) -- see
  infra/aws/README.md.

Parameters:
  GitHubOrg:
    Type: String
    Description: >
      The GitHub organization or user that owns the repo, e.g.
      "Crooked-Cat-Tail-Software".

  GitHubRepo:
    Type: String
    Default: snake-arena
    Description: The repository name.

  GitHubBranch:
    Type: String
    Default: main
    Description: >
      Only workflow runs triggered against this branch can assume the
      role -- a run on any other branch (or a fork's pull request) is
      refused by AWS itself, before anything in the workflow file even
      runs.

  ProjectName:
    Type: String
    Default: snake-arena
    Description: >
      Must match the ProjectName used with 01-ecr.yaml / 02-app.yaml /
      deploy.sh -- this role's permissions are scoped to resources
      named from it (the ECR repo, the two CloudFormation stacks, the
      ECS execution role).

  ExistingOIDCProviderArn:
    Type: String
    Default: ""
    Description: >
      Leave blank the first time you deploy this in your account. AWS
      allows only ONE GitHub OIDC provider per account (for the URL
      token.actions.githubusercontent.com) -- if you've already set one
      up for a different repo (e.g. via the AWS Agent Toolkit, or
      another project), deploying this stack again with a blank value
      fails with "Provider already exists". Paste that existing
      provider's ARN here instead, and this stack reuses it rather than
      creating a second one.

Conditions:
  CreateOIDCProvider: !Equals [!Ref ExistingOIDCProviderArn, ""]

Resources:
  GitHubOIDCProvider:
    Condition: CreateOIDCProvider
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      # GitHub's own documented thumbprints for this provider. AWS has
      # not required these to be accurate for validation for some time
      # now (it validates via its own trusted CA bundle instead), but
      # the CloudFormation resource still requires the property to be
      # present.
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-github-deploy-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOIDCProvider
                - !Ref GitHubOIDCProvider
                - !Ref ExistingOIDCProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # Only a workflow run against this exact branch of this
                # exact repo can assume this role -- a pull request from
                # a fork, or a push to any other branch, presents a
                # different `sub` claim and is refused.
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOrg}/${GitHubRepo}:ref:refs/heads/${GitHubBranch}"
      Policies:
        - PolicyName: snake-arena-deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # --- ECR: push the built image ---
              - Sid: ECRAuth
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: ECRPushAndManageRepo
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:PutImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:BatchGetImage
                  - ecr:DescribeRepositories
                  - ecr:CreateRepository
                  - ecr:DeleteRepository
                  - ecr:PutLifecyclePolicy
                  - ecr:PutImageScanningConfiguration
                  - ecr:TagResource
                Resource: !Sub "arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ProjectName}"

              # --- CloudFormation: deploy.sh's two `aws cloudformation
              # deploy` calls, which under the hood create/execute a
              # change set against each stack ---
              - Sid: CloudFormationDeploy
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ValidateTemplate
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:ListStackResources
                  - cloudformation:ListChangeSets
                Resource:
                  - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ProjectName}-ecr/*"
                  - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ProjectName}-app/*"

              # --- IAM: 02-app.yaml creates exactly one role (the ECS
              # execution role) and needs to pass it to the ECS service
              # it also creates. Scoped to that one role's name only --
              # this role cannot create, modify, or pass any other IAM
              # role or user in the account. ---
              - Sid: ManageECSExecutionRole
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-ecs-execution-role"
              - Sid: PassECSExecutionRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-ecs-execution-role"
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com

              # --- Everything else 02-app.yaml creates: a VPC and its
              # networking, RDS, ECS, and the ALB. AWS does not support
              # resource-level ARN restrictions for most of these
              # services' create actions (the resource doesn't exist
              # yet to have an ARN), so this is scoped by action instead
              # of by resource -- the same shape of access a person
              # running deploy.sh themselves needs, no broader. This
              # role cannot touch VPCs/RDS instances/etc. that
              # deploy.sh's own stacks didn't create, since CloudFormation
              # only ever acts on resources it manages within the two
              # stacks above. ---
              - Sid: NetworkingComputeAndDataPlane
                Effect: Allow
                Action:
                  - ec2:CreateVpc
                  - ec2:DeleteVpc
                  - ec2:DescribeVpcs
                  - ec2:ModifyVpcAttribute
                  - ec2:CreateInternetGateway
                  - ec2:DeleteInternetGateway
                  - ec2:DescribeInternetGateways
                  - ec2:AttachInternetGateway
                  - ec2:DetachInternetGateway
                  - ec2:CreateSubnet
                  - ec2:DeleteSubnet
                  - ec2:DescribeSubnets
                  - ec2:ModifySubnetAttribute
                  - ec2:CreateRouteTable
                  - ec2:DeleteRouteTable
                  - ec2:DescribeRouteTables
                  - ec2:CreateRoute
                  - ec2:DeleteRoute
                  - ec2:ReplaceRoute
                  - ec2:AssociateRouteTable
                  - ec2:DisassociateRouteTable
                  - ec2:ReplaceRouteTableAssociation
                  - ec2:CreateSecurityGroup
                  - ec2:DeleteSecurityGroup
                  - ec2:DescribeSecurityGroups
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:RevokeSecurityGroupIngress
                  - ec2:AuthorizeSecurityGroupEgress
                  - ec2:RevokeSecurityGroupEgress
                  - ec2:DescribeAvailabilityZones
                  - ec2:DescribeAccountAttributes
                  - ec2:CreateTags
                  - ec2:DeleteTags
                  - ec2:DescribeTags
                  - rds:CreateDBInstance
                  - rds:DeleteDBInstance
                  - rds:ModifyDBInstance
                  - rds:DescribeDBInstances
                  - rds:CreateDBSubnetGroup
                  - rds:DeleteDBSubnetGroup
                  - rds:DescribeDBSubnetGroups
                  - rds:ModifyDBSubnetGroup
                  - rds:AddTagsToResource
                  - rds:ListTagsForResource
                  - rds:DescribeDBEngineVersions
                  - ecs:CreateCluster
                  - ecs:DeleteCluster
                  - ecs:DescribeClusters
                  - ecs:RegisterTaskDefinition
                  - ecs:DeregisterTaskDefinition
                  - ecs:DescribeTaskDefinition
                  - ecs:CreateService
                  - ecs:UpdateService
                  - ecs:DeleteService
                  - ecs:DescribeServices
                  - ecs:ListTagsForResource
                  - ecs:TagResource
                  - elasticloadbalancing:CreateLoadBalancer
                  - elasticloadbalancing:DeleteLoadBalancer
                  - elasticloadbalancing:DescribeLoadBalancers
                  - elasticloadbalancing:ModifyLoadBalancerAttributes
                  - elasticloadbalancing:DescribeLoadBalancerAttributes
                  - elasticloadbalancing:CreateTargetGroup
                  - elasticloadbalancing:DeleteTargetGroup
                  - elasticloadbalancing:DescribeTargetGroups
                  - elasticloadbalancing:ModifyTargetGroup
                  - elasticloadbalancing:ModifyTargetGroupAttributes
                  - elasticloadbalancing:DescribeTargetGroupAttributes
                  - elasticloadbalancing:CreateListener
                  - elasticloadbalancing:DeleteListener
                  - elasticloadbalancing:DescribeListeners
                  - elasticloadbalancing:ModifyListener
                  - elasticloadbalancing:AddTags
                  - elasticloadbalancing:DescribeTags
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:DescribeLogGroups
                  - logs:PutRetentionPolicy
                  - logs:TagResource
                  - logs:ListTagsForResource
                  - secretsmanager:DescribeSecret
                Resource: "*"

Outputs:
  DeployRoleArn:
    Description: >
      Paste this into the GitHub repo's AWS_DEPLOY_ROLE_ARN Actions
      variable (Settings -> Secrets and variables -> Actions ->
      Variables tab -- a variable, not a secret, since a role ARN isn't
      sensitive on its own).
    Value: !GetAtt DeployRole.Arn

  OIDCProviderArn:
    Description: >
      The GitHub OIDC provider's ARN. Only meaningful if this stack
      created one (ExistingOIDCProviderArn was left blank) -- reuse this
      value as ExistingOIDCProviderArn if you ever deploy a second
      instance of this stack (e.g. a second project) in this account.
    Value: !If
      - CreateOIDCProvider
      - !Ref GitHubOIDCProvider
      - !Ref ExistingOIDCProviderArn
