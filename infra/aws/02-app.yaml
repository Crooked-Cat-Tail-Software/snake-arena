AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Snake Arena -- the application itself: a VPC, an RDS Postgres database,
  an ECS Fargate service running the app container, and an internet-facing
  Application Load Balancer in front of it. Deploy 01-ecr.yaml first, push
  an image to it, then deploy this stack with that image's URI as the
  ImageUri parameter (deploy.sh does all of this for you -- see
  infra/aws/README.md).

  Cost note: this creates real, billable resources (RDS instance, ALB,
  Fargate task) that keep costing money while the stack exists, whether or
  not anyone is playing the game -- see README.md for a rough estimate and
  use teardown.sh when you're done with it.

Parameters:
  ProjectName:
    Type: String
    Default: snake-arena
    Description: Used to name/tag every resource in this stack, and to look up 01-ecr.yaml's exports.

  ImageUri:
    Type: String
    Description: >
      Full ECR image URI including tag, e.g.
      123456789012.dkr.ecr.us-east-1.amazonaws.com/snake-arena:20260101120000.
      Produced by pushing an image to the repository 01-ecr.yaml creates
      (deploy.sh does this for you).

  DBMasterUsername:
    Type: String
    Default: snake_arena
    Description: RDS master username. Matches the app's expected DB_USER.

  DeploymentEnvironment:
    Type: String
    Default: dev
    AllowedValues: ["dev", "prod"]
    Description: >
      Reported on every trace as deployment.environment.name (see
      backend/app/telemetry.py). deploy.sh sets this from the project name
      (a "-prod" suffix means prod); promote.sh always passes prod.

  DBName:
    Type: String
    Default: snake_arena
    Description: Database name the app connects to.

  DBInstanceClass:
    Type: String
    Default: db.t4g.micro
    Description: >
      Smallest/cheapest widely-available class. db.t3.micro is a
      same-price x86 alternative if t4g (Graviton/ARM) isn't available in
      your account/region.

  DBAllocatedStorage:
    Type: Number
    Default: 20
    Description: GB. 20 is RDS's minimum for Postgres gp3 storage.

  ContainerCpu:
    Type: String
    Default: "256"
    Description: Fargate task CPU units (256 = 0.25 vCPU, the smallest/cheapest size). Must pair with a valid ContainerMemory -- see AWS Fargate task size table.

  ContainerMemory:
    Type: String
    Default: "512"
    Description: Fargate task memory in MB. 512 is the smallest value valid with 256 CPU units.

  DesiredCount:
    Type: Number
    Default: 1
    Description: Number of running copies of the app. 1 is enough for a class exercise; the leaderboard lives in RDS, not in the container, so this can scale later without code changes.

  CollectorImage:
    Type: String
    Default: public.ecr.aws/aws-observability/aws-otel-collector:v0.50.0
    Description: >
      AWS Distro for OpenTelemetry (ADOT) collector, run as a sidecar that
      forwards the app's traces to AWS X-Ray. Pinned to a release; must be
      v0.34.0 or newer (older versions silently drop W3C-format trace IDs).

  AlertOwner:
    Type: String
    Default: dbrown77
    Description: >
      Who responds to this app's alerts. Shown in the alert text (and the
      notification email) and set as the alarm's "owner" tag.

  ObservabilityStackName:
    Type: String
    Default: snake-arena-observability
    Description: >
      The shared observability stack (01-observability.yaml) this app sends
      its metrics and alarm notifications to. Deploy it first -- deploy.sh
      checks. Shared by dev and prod.

  DBDeletionProtection:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      "false" for dev (meant to be torn down between sessions). "true"
      for production -- RDS then refuses to delete the database (the
      leaderboard), even via a stack delete, until this is set back to
      "false" on purpose. deploy.sh's third argument sets this.

  VpcCidr:
    Type: String
    Default: 10.0.0.0/16

  PublicSubnet1Cidr:
    Type: String
    Default: 10.0.0.0/24

  PublicSubnet2Cidr:
    Type: String
    Default: 10.0.1.0/24

Resources:
  # ---------------------------------------------------------------------
  # Networking: one VPC, two public subnets (two AZs -- required by both
  # the ALB and the RDS subnet group), no NAT gateway. Keeping everything
  # in public subnets (with security groups doing the actual access
  # control, not subnet placement) avoids a NAT gateway's ~$30+/month
  # fixed cost, which isn't worth it for a class exercise. RDS still sets
  # PubliclyAccessible: false, so it gets no public IP regardless of the
  # subnet's route table -- only resources in the ECS security group can
  # reach it, enforced at the security-group layer.
  # ---------------------------------------------------------------------
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-vpc"

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-igw"

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-public-1"

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-public-2"

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-public-rt"

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  # ---------------------------------------------------------------------
  # Security groups
  # ---------------------------------------------------------------------
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${ProjectName} ALB -- allows inbound HTTP from the internet"
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-alb-sg"

  ECSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${ProjectName} ECS tasks -- allows inbound only from the ALB"
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourceSecurityGroupId: !Ref ALBSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-ecs-sg"

  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${ProjectName} RDS -- allows inbound only from the ECS tasks"
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref ECSSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-rds-sg"

  # ---------------------------------------------------------------------
  # Database: RDS Postgres. ManageMasterUserPassword lets RDS generate
  # and own the master password in AWS Secrets Manager -- it never
  # appears in this template, the stack's parameters, or CloudTrail in
  # plaintext. The ECS execution role below is granted read access to
  # that specific secret, and the task definition injects it directly
  # into the container as DB_PASSWORD (see backend/app/database.py's
  # split-var connection logic).
  # ---------------------------------------------------------------------
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "${ProjectName} DB subnet group"
      SubnetIds:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2

  DBInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub "${ProjectName}-db"
      Engine: postgres
      # Pinned to a concrete, currently-supported minor version rather
      # than a bare major version (RDS doesn't accept a bare major
      # version like "16" for new instances). If this has aged out by
      # the time you deploy, check the current list at
      # https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/PostgreSQL.Concepts.General.DBVersions.html
      # and bump it -- any 16.x is fine, the app doesn't depend on a
      # specific minor version.
      EngineVersion: "16.15"
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: !Ref DBAllocatedStorage
      StorageType: gp3
      MasterUsername: !Ref DBMasterUsername
      ManageMasterUserPassword: true
      DBName: !Ref DBName
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - !Ref RDSSecurityGroup
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 7
      # Off for dev (torn down between sessions, see teardown.sh), on
      # for production -- see the DBDeletionProtection parameter.
      DeletionProtection: !Ref DBDeletionProtection
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-db"

  # ---------------------------------------------------------------------
  # ECS: cluster, log group, execution role, task definition, service
  # ---------------------------------------------------------------------
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${ProjectName}-cluster"

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${ProjectName}"
      RetentionInDays: 14

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-ecs-execution-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Pull the image from ECR, write container logs to CloudWatch.
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: GetDbSecret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !GetAtt DBInstance.MasterUserSecret.SecretArn

  # Role the running containers use (unlike ExecutionRole, which ECS
  # itself uses to start them). Only the ADOT collector needs AWS access:
  # writing traces to X-Ray and metrics to the shared metrics log group.
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-ecs-task-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
            # Only ECS tasks in this account can assume it (confused-deputy
            # protection).
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*"
      Policies:
        - PolicyName: WriteTracesToXRay
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                # X-Ray's write actions don't support resource-level scoping.
                Resource: "*"
        - PolicyName: WriteMetricsToCloudWatch
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:DescribeLogStreams
                  - logs:PutLogEvents
                # The shared metrics log group (01-observability.yaml).
                Resource:
                  Fn::ImportValue: !Sub "${ObservabilityStackName}-MetricsLogGroupArn"

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${ProjectName}-task"
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      Cpu: !Ref ContainerCpu
      Memory: !Ref ContainerMemory
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      # Must match the platform deploy.sh builds the image for.
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: X86_64
      ContainerDefinitions:
        - Name: !Ref ProjectName
          Image: !Ref ImageUri
          Essential: true
          PortMappings:
            - ContainerPort: 8000
              Protocol: tcp
          Environment:
            # Split-var form (see backend/app/database.py) -- the RDS
            # endpoint is only known at deploy time, and the password
            # comes from Secrets Manager below, not a plain env var.
            - Name: DB_HOST
              Value: !GetAtt DBInstance.Endpoint.Address
            - Name: DB_PORT
              Value: !GetAtt DBInstance.Endpoint.Port
            - Name: DB_NAME
              Value: !Ref DBName
            # Trace resource attributes -- see backend/app/telemetry.py.
            # service.version comes from APP_VERSION, baked into the image
            # by build.sh, so it isn't set here.
            - Name: APP_ENVIRONMENT
              Value: !Ref DeploymentEnvironment
            # The collector sidecar below -- containers in one Fargate task
            # share localhost.
            - Name: OTEL_EXPORTER_OTLP_ENDPOINT
              Value: http://localhost:4318
          DependsOn:
            # START, not HEALTHY: the game must come up even if the
            # collector can't (tracing is best-effort).
            - ContainerName: otel-collector
              Condition: START
          Secrets:
            - Name: DB_USER
              ValueFrom: !Sub "${DBInstance.MasterUserSecret.SecretArn}:username::"
            - Name: DB_PASSWORD
              ValueFrom: !Sub "${DBInstance.MasterUserSecret.SecretArn}:password::"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
        # ADOT collector sidecar: receives the app's OTLP traces and
        # forwards them to X-Ray. Listens on 127.0.0.1 only, so nothing
        # outside this task can send it spans. Non-essential and capped at
        # 128 MB, so a collector problem can't take the game down or starve
        # it of memory; ECS restarts it if it exits.
        - Name: otel-collector
          Image: !Ref CollectorImage
          Essential: false
          Memory: 128
          RestartPolicy:
            Enabled: true
          Environment:
            - Name: AOT_CONFIG_CONTENT
              Value: !Sub
                - |
                  extensions:
                    health_check:
                      endpoint: 127.0.0.1:13133
                  receivers:
                    otlp:
                      protocols:
                        http:
                          endpoint: 127.0.0.1:4318
                  processors:
                    memory_limiter:
                      check_interval: 5s
                      limit_mib: 100
                      spike_limit_mib: 25
                    batch: {}
                  exporters:
                    awsxray:
                      region: ${AWS::Region}
                      # Searchable in X-Ray as annotations
                      # (deployment_environment_name, service_version). Only
                      # *span* attributes are indexed -- the app copies these
                      # two resource attributes onto every span (see
                      # backend/app/telemetry.py), since this ADOT build has
                      # no transform processor to do it here.
                      indexed_attributes:
                        - deployment.environment.name
                        - service.version
                    # Game metrics -> CloudWatch, namespace SnakeArena. Only
                    # the declarations below are published, each with only
                    # the listed dimensions (every dimension combination is a
                    # separately billed metric; rollups and per-task IDs
                    # would multiply that). service.version is a dimension so
                    # dashboards can filter by release; each deploy starts new
                    # series and the old ones stop, so the billed count stays
                    # ~flat. Totals across versions are summed at query time.
                    awsemf:
                      region: ${AWS::Region}
                      namespace: SnakeArena
                      # Shared with the other environment (one stream each).
                      log_group_name: ${MetricsLogGroupName}
                      log_stream_name: ${ProjectName}
                      dimension_rollup_option: NoDimensionRollup
                      resource_to_telemetry_conversion:
                        enabled: true
                      metric_declarations:
                        - dimensions: [[deployment.environment.name, service.version]]
                          metric_name_selectors:
                            - "^scores[.]submitted$"
                            - "^scores[.]value$"
                            - "^leaderboard[.]reads$"
                            - "^leaderboard[.]new_top_score$"
                        - dimensions: [[deployment.environment.name, service.version, reason]]
                          metric_name_selectors:
                            - "^scores[.]rejected$"
                            - "^client[.]canvas_creation_failures$"
                  service:
                    extensions: [health_check]
                    pipelines:
                      traces:
                        receivers: [otlp]
                        processors: [memory_limiter, batch]
                        exporters: [awsxray]
                      metrics:
                        receivers: [otlp]
                        processors: [memory_limiter, batch]
                        exporters: [awsemf]
                - MetricsLogGroupName:
                    Fn::ImportValue: !Sub "${ObservabilityStackName}-MetricsLogGroupName"
          HealthCheck:
            Command: ["/healthcheck"]
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 10
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: otel

  # ---------------------------------------------------------------------
  # Load balancer
  # ---------------------------------------------------------------------
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${ProjectName}-alb"
      Scheme: internet-facing
      Type: application
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      SecurityGroups:
        - !Ref ALBSecurityGroup

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${ProjectName}-tg"
      Port: 8000
      Protocol: HTTP
      VpcId: !Ref VPC
      TargetType: ip
      HealthCheckPath: /api/health
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  Service:
    Type: AWS::ECS::Service
    DependsOn: Listener
    Properties:
      ServiceName: !Sub "${ProjectName}-service"
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      HealthCheckGracePeriodSeconds: 60
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - !Ref PublicSubnet1
            - !Ref PublicSubnet2
          SecurityGroups:
            - !Ref ECSSecurityGroup
      LoadBalancers:
        - ContainerName: !Ref ProjectName
          ContainerPort: 8000
          TargetGroupArn: !Ref TargetGroup

  # ---------------------------------------------------------------------
  # Alarms (~$0.10/month per metric they watch). They notify through the
  # shared alarm topic in 01-observability.yaml (emails are set up there).
  # ---------------------------------------------------------------------
  # 5xx from the app itself (Target) or from the ALB (e.g. 502/503 when no
  # healthy task is running), summed.
  ServerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-5xx-errors"
      AlarmDescription: 5 or more server errors (5xx) in 5 minutes.
      Metrics:
        - Id: total
          Label: 5xx responses (app + load balancer)
          Expression: FILL(app5xx, 0) + FILL(alb5xx, 0)
          ReturnData: true
        - Id: app5xx
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/ApplicationELB
              MetricName: HTTPCode_Target_5XX_Count
              Dimensions:
                - Name: LoadBalancer
                  Value: !GetAtt LoadBalancer.LoadBalancerFullName
            Period: 300
            Stat: Sum
        - Id: alb5xx
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/ApplicationELB
              MetricName: HTTPCode_ELB_5XX_Count
              Dimensions:
                - Name: LoadBalancer
                  Value: !GetAtt LoadBalancer.LoadBalancerFullName
            Period: 300
            Stat: Sum
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Threshold: 5
      EvaluationPeriods: 1
      TreatMissingData: notBreaching
      AlarmActions:
        - Fn::ImportValue: !Sub "${ObservabilityStackName}-AlarmTopicArn"
      OKActions:
        - Fn::ImportValue: !Sub "${ObservabilityStackName}-AlarmTopicArn"

  # The app and the collector share the task's memory; sustained >80%
  # means it's time to raise ContainerMemory before the task gets killed.
  MemoryHighAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-memory-high"
      AlarmDescription: ECS task memory above 80% for 15 minutes.
      Namespace: AWS/ECS
      MetricName: MemoryUtilization
      Dimensions:
        - Name: ClusterName
          Value: !Ref ECSCluster
        - Name: ServiceName
          Value: !GetAtt Service.Name
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Fn::ImportValue: !Sub "${ObservabilityStackName}-AlarmTopicArn"
      OKActions:
        - Fn::ImportValue: !Sub "${ObservabilityStackName}-AlarmTopicArn"

  # Actionable alert: players can't start the game. Each failure is one
  # page load whose game canvas couldn't start (the browser reports at
  # most once per page load, so one player retrying counts once). One
  # failure is usually one player's browser quirk; 3+ in 10 minutes means
  # several real players can't play at all -- at this game's traffic, an
  # outage. Watches only the version this stack is running (taken from the
  # image tag, which build.sh also bakes in as service.version), so the
  # alert names the release that's failing; every deploy/promote updates it.
  CanvasCreationFailuresAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-canvas-creation-failures"
      AlarmDescription: !Sub
        - >-
          Players can't start the game: 3+ page loads failed to create the
          game canvas in 10 minutes.
          service=snake-arena-backend environment=${DeploymentEnvironment}
          version=${Version} owner=${AlertOwner}
          dashboard=${DashboardUrl} (set Environment=${DeploymentEnvironment}).
          Runbook: 1) Dashboard "Canvas creation failures" chart: which
          reason, which version. 2) Began right after deploying this
          version? Roll back: infra/aws/deploy.sh (dev) or redeploy the
          previous tag (prod), then investigate frontend/src/game.js and
          App.jsx. 3) Only no_2d_context, no recent deploy: likely a browser
          or extension change; try several browsers. 4) Sudden burst: the
          report endpoint is public; check X-Ray traces of POST
          /api/client-errors for a single client IP (possible false alarm).
        - Version: !Select [1, !Split [":", !Ref ImageUri]]
          DashboardUrl:
            Fn::ImportValue: !Sub "${ObservabilityStackName}-DashboardUrl"
      Metrics:
        - Id: failures
          Label: Canvas creation failures (all reasons)
          Expression: FILL(nocontext, 0) + FILL(exception, 0)
          ReturnData: true
        - Id: nocontext
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: SnakeArena
              MetricName: client.canvas_creation_failures
              Dimensions:
                - Name: deployment.environment.name
                  Value: !Ref DeploymentEnvironment
                - Name: service.version
                  Value: !Select [1, !Split [":", !Ref ImageUri]]
                - Name: reason
                  Value: no_2d_context
            Period: 600
            Stat: Sum
        - Id: exception
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: SnakeArena
              MetricName: client.canvas_creation_failures
              Dimensions:
                - Name: deployment.environment.name
                  Value: !Ref DeploymentEnvironment
                - Name: service.version
                  Value: !Select [1, !Split [":", !Ref ImageUri]]
                - Name: reason
                  Value: exception
            Period: 600
            Stat: Sum
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Threshold: 3
      EvaluationPeriods: 1
      TreatMissingData: notBreaching
      AlarmActions:
        - Fn::ImportValue: !Sub "${ObservabilityStackName}-AlarmTopicArn"
      OKActions:
        - Fn::ImportValue: !Sub "${ObservabilityStackName}-AlarmTopicArn"
      Tags:
        - Key: service
          Value: snake-arena-backend
        - Key: environment
          Value: !Ref DeploymentEnvironment
        - Key: version
          Value: !Select [1, !Split [":", !Ref ImageUri]]
        - Key: owner
          Value: !Ref AlertOwner

Outputs:
  AppUrl:
    Description: Open this in a browser to play the game.
    Value: !Sub "http://${LoadBalancer.DNSName}"

  DBEndpoint:
    Description: RDS endpoint (for reference/debugging -- not reachable from outside the VPC).
    Value: !GetAtt DBInstance.Endpoint.Address

  ECSClusterName:
    Value: !Ref ECSCluster

  ECSServiceName:
    Value: !Sub "${ProjectName}-service"
